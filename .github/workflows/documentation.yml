name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: r-lib/actions/setup-r@v2
      - uses: julia-actions/cache@v2
      - name: Point RCall at R
        run: |
          echo "R_HOME=$(R RHOME)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(R RHOME)/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Install dependencies
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Load package (surface precompile errors)
        run: julia --project=docs/ --compiled-modules=no -e 'using RSetup'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs/ docs/make.jl
