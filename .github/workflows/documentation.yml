name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: r-lib/actions/setup-r@v2
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: R diagnostics
        run: |
          which R; R RHOME; ls "$(R RHOME)/lib" || true
          cat ~/.julia/packages/RCall/*/deps/deps.jl 2>/dev/null; cat ~/.julia/scratchspaces/44cfe95a-1eb2-52ea-b672-e2afdf69b78f/*/build.log 2>/dev/null | tail -20
          julia --project=docs/ -e 'using Pkg; Pkg.build("RCall"; verbose=true)' 2>&1 | tail -20
      - name: Load package (surface precompile errors)
        run: julia --project=docs/ --compiled-modules=no -e 'using RSetup'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs/ docs/make.jl
